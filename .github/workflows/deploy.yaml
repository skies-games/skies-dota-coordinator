name: Deploy

on:
  push:
    branches: [otel-direct-backends]

env:
  SSH_USER: root
  DEPLOY_PATH: /root/skies-dota-coordinator

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.IP }}
          username: ${{ env.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd "${{ env.DEPLOY_PATH }}"
            git fetch origin otel-direct-backends
            git reset --hard origin/otel-direct-backends
            cargo build --release
            systemctl restart coordinator.service
            systemctl is-active --quiet coordinator.service
