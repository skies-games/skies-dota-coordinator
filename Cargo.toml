[package]
name = "coordinator"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = {version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rand = "0.10.1"
dotenvy = "0.15.7"
opentelemetry = { version = "0.32.0", features = ["logs", "metrics", "trace"] }
opentelemetry-appender-tracing = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["grpc-tonic", "http-proto", "reqwest-client", "logs", "metrics", "trace"] }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio", "experimental_logs_batch_log_processor_with_async_runtime"] }
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.3"
tracing-opentelemetry = "0.33.0"
